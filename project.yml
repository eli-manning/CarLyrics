name: CarLyrics
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: $(CARLYRICS_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SpotifyLogin:
    url: https://github.com/spotify/ios-auth.git
    from: 3.1.2
targets:
  CarLyrics:
    type: application
    platform: iOS
    sources:
      - CarLyrics
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CARLYRICS_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CarLyrics/Info.plist
    info:
      path: CarLyrics/Info.plist
      properties:
        CFBundleDisplayName: CarLyrics
        SharedKeychainGroup: $(AppIdentifierPrefix)$(CARLYRICS_BUNDLE_ID).shared
        SpotifyClientID: $(CARLYRICS_SPOTIFY_CLIENT_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [audio]
        LSApplicationQueriesSchemes: [spotify]
        CFBundleURLTypes:
          - CFBundleURLName: $(CARLYRICS_BUNDLE_ID)
            CFBundleURLSchemes: [carlyrics]
    entitlements:
      path: CarLyrics/CarLyrics.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(CARLYRICS_BUNDLE_ID).shared]
    dependencies:
      - target: CarLyricsWidget
      - package: SpotifyLogin
  CarLyricsWidget:
    type: app-extension
    platform: iOS
    sources:
      - CarLyricsWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CARLYRICS_BUNDLE_ID).widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CarLyricsWidget/Info.plist
    entitlements:
      path: CarLyricsWidget/CarLyricsWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(CARLYRICS_BUNDLE_ID).shared]
    info:
      path: CarLyricsWidget/Info.plist
      properties:
        CFBundleDisplayName: CarLyrics
        SharedKeychainGroup: $(AppIdentifierPrefix)$(CARLYRICS_BUNDLE_ID).shared
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
